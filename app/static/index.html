<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northwind HR Helpdesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e9efec;
      --panel: #ffffff;
      --ink: #1d2b30;
      --muted: #5b6e72;
      --accent: #12605c;
      --user-bubble: #d3e5e0;
      --line: #c9d6d2;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #142023;
        --panel: #1c2b2f;
        --ink: #e3ecea;
        --muted: #93a9a6;
        --accent: #5cc2b6;
        --user-bubble: #23423f;
        --line: #2f4347;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      display: flex;
      justify-content: center;
    }
    main {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 24px 16px;
    }
    header h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
    header p { margin: 4px 0 16px; color: var(--muted); }
    #messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px 12px 0 0;
    }
    .empty { color: var(--muted); margin: auto; text-align: center; max-width: 36ch; }
    .msg { max-width: 80%; padding: 10px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg.user { align-self: flex-end; background: var(--user-bubble); border-radius: 14px 14px 4px 14px; }
    .msg.bot { align-self: flex-start; border-left: 3px solid var(--accent); padding-left: 12px; }
    .msg.error { color: #b3261e; border-left-color: #b3261e; }
    .sources { display: block; margin-top: 4px; font-size: 0.8rem; color: var(--muted); }
    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: none;
      border-radius: 0 0 12px 12px;
    }
    input {
      flex: 1;
      font: inherit;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
    }
    button {
      font: inherit;
      font-weight: 500;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) { button { color: #0e1a1c; } }
    button:disabled { opacity: 0.5; cursor: wait; }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Northwind HR Helpdesk</h1>
      <p>Ask about leave, remote work, expenses or IT security.</p>
    </header>

    <div id="messages" data-testid="messages" aria-live="polite">
      <p class="empty" id="empty-state">Try “How many days of annual leave do I get?”</p>
    </div>

    <form id="chat-form">
      <input id="message-input" data-testid="message-input" type="text"
             placeholder="Type your question" autocomplete="off" aria-label="Your question">
      <button id="send-btn" data-testid="send-button" type="submit">Send</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const button = document.getElementById("send-btn");
    const messages = document.getElementById("messages");

    function addMessage(text, role, sources) {
      document.getElementById("empty-state")?.remove();
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.dataset.testid = role === "user" ? "user-message" : "bot-message";
      div.textContent = text;
      if (sources && sources.length) {
        const s = document.createElement("span");
        s.className = "sources";
        s.textContent = "Source: " + [...new Set(sources.map(x => x.document))].join(", ");
        div.appendChild(s);
      }
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;               // empty questions are never sent

      addMessage(text, "user");
      input.value = "";
      button.disabled = true;
      button.textContent = "Sending…";

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        if (!res.ok) throw new Error("The server returned " + res.status);
        const data = await res.json();
        addMessage(data.answer, "bot", data.sources);
      } catch (err) {
        addMessage("Couldn't get an answer. " + err.message + ". Try again.", "bot error");
      } finally {
        button.disabled = false;
        button.textContent = "Send";
        input.focus();
      }
    });
  </script>
</body>
</html>
